name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q volcan_tv_project.zip
          mv volcan/app ./app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        working-directory: app
        run: |
          flutter create . --platforms=android --org com.volcan --project-name volcan_tv
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
      - name: Icons
        working-directory: app
        run: |
          grep -q "assets/logo.png" pubspec.yaml || sed -i 's#^  uses-material-design: true#  uses-material-design: true\n  assets:\n    - assets/logo.png#' pubspec.yaml
          flutter pub add dev:flutter_launcher_icons
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon.png"\n' > flutter_launcher_icons.yaml
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build
        working-directory: app
        run: flutter build apk --release --dart-define=SB_URL=${{ secrets.SB_URL }} --dart-define=SB_KEY=${{ secrets.SB_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: VolcanTV-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
