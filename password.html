<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volcan TV - تغيير كلمة المرور</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
body{font-family:system-ui,Tahoma,sans-serif;background:#12161b;color:#f1f3f5;margin:auto;padding:20px;max-width:460px}
h1{color:#ff5a1f;font-size:22px}
.box{background:#1d232b;border:1px solid #2a323c;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
input,button{padding:13px;border-radius:10px;border:1px solid #2a323c;background:#12161b;color:#f1f3f5;font-size:15px;width:100%;box-sizing:border-box}
button{background:#ff5a1f;border:0;font-weight:700;cursor:pointer}
#m{min-height:20px;font-size:14px}.ok{color:#4ade80}.er{color:#f87171}
</style></head><body>
<h1>🌋 Volcan TV — تغيير كلمة المرور</h1>
<div class="box">
<input id="u" placeholder="اسم المستخدم" autocomplete="username">
<input id="o" type="password" placeholder="كلمة المرور الحالية" autocomplete="current-password">
<input id="n" type="password" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)" autocomplete="new-password">
<input id="n2" type="password" placeholder="أعد كتابة الجديدة" autocomplete="new-password">
<div id="m"></div>
<button id="b">تغيير كلمة المرور</button>
</div>
<script>
const URL_='https://oqqyjpxkmuijbrucszrz.supabase.co';
let KEY=window.VK||'';try{KEY=KEY||localStorage.getItem('vk')||''}catch(e){}
if(!KEY||KEY.indexOf('ضع')===0){KEY=(prompt('الصق المفتاح العام (Publishable key):')||'').trim()}
const sb=supabase.createClient(URL_,KEY,{auth:{persistSession:false}});
const $=i=>document.getElementById(i);
function say(t,ok){$('m').textContent=t;$('m').className=ok?'ok':'er'}
$('b').onclick=async()=>{
 const u=$('u').value.trim().toLowerCase(),o=$('o').value,n=$('n').value;
 if(u.length<3||!o)return say('اكتب اسم المستخدم وكلمة المرور الحالية');
 if(n.length<6)return say('كلمة المرور الجديدة 6 أحرف على الأقل');
 if(n!==$('n2').value)return say('كلمتا المرور الجديدتان غير متطابقتين');
 $('b').disabled=true;say('جاري التغيير...',true);
 const {error:e1}=await sb.auth.signInWithPassword({email:u+'@volcan.app',password:o});
 if(e1){$('b').disabled=false;return say('اسم المستخدم أو كلمة المرور الحالية غير صحيحة')}
 const {error:e2}=await sb.auth.updateUser({password:n});
 await sb.auth.signOut();$('b').disabled=false;
 if(e2)return say('تعذّر التغيير: '+e2.message);
 say('تم تغيير كلمة المرور بنجاح ✅ سجّل الدخول بها بالتطبيق.',true);
 ['o','n','n2'].forEach(i=>$(i).value='');
};
</script></body></html>
